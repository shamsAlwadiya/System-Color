<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <title>Palette Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Palette Generator🎨</h2>
      <p>
        Choose a color and a matching color palette will be generated
        automatically!
      </p>

      <div class="color-input">
        <label for="baseColor">Primary color:🎯 </label>
        <input type="color" id="baseColor" value="#3498db" />
      </div>

      <div class="palette" id="palette"></div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
